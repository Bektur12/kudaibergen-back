spring:
  application:
    name: kudaibergen-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kudaibergen}
    username: ${DB_USER:kudaibergen}
    password: ${DB_PASSWORD:kudaibergen}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # null-поля оставляем в ответе: клиент рассчитывает на "debugCode": null и т.п.
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  # за балансировщиком: реальный IP клиента из X-Forwarded-For (нужен для rate limit)
  forward-headers-strategy: native
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # HS256, минимум 32 байта. В проде передавать через переменную окружения.
    secret: ${JWT_SECRET:change-me-in-production-please-32-bytes-minimum-secret}
    access-ttl: 15m
    refresh-ttl: 30d
  otp:
    code-ttl: 2m
    resend-interval: 42s
    max-attempts: 5
    # после max-attempts неверных вводов номер блокируется
    block-duration: 15m
    # лимиты отправки: на номер и на IP за окно
    phone-limit: 5
    ip-limit: 20
    limit-window: 1h
    # ключ HMAC для хэша кода в Redis; по умолчанию берётся JWT_SECRET
    hash-secret: ${OTP_HASH_SECRET:${JWT_SECRET:change-me-in-production-please-32-bytes-minimum-secret}}
    # в dev-режиме код возвращается в ответе /auth/otp/send
    expose-code: ${SMS_EXPOSE_CODE:true}
    # тестовый стенд: если задан, все коды входа равны ему (SMS_FIXED_CODE=1111). В проде оставить пустым
    fixed-code: ${SMS_FIXED_CODE:}
  sms:
    provider: ${SMS_PROVIDER:log}       # log | nikita
    nikita:
      url: ${SMS_URL:https://smspro.nikita.kg/api/message}
      login: ${SMS_LOGIN:}
      password: ${SMS_PASSWORD:}
      sender: ${SMS_SENDER:Kudaibergen}
  market:
    # ссылка в QR-наклейках рядов и контейнеров; приложение ловит её как deep link
    qr-base-url: ${QR_BASE_URL:https://kudaibergen.kg/qr/}
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS:}
    # содержимое service account JSON целиком (для окружений без файлов); приоритетнее пути
    credentials-json: ${FCM_CREDENTIALS_JSON:}

logging:
  level:
    kg.kudaibergen: INFO
