spring:
  application:
    name: kudaibergen-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kudaibergen}
    username: ${DB_USER:kudaibergen}
    password: ${DB_PASSWORD:kudaibergen}
    hikari:
      data-source-properties:
        # нативные enum-типы Postgres (user_role, request_status, offer_status, verification_status):
        # драйвер шлёт строки без типа, а Postgres сам приводит их к нужному enum
        stringtype: unspecified
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    # null-поля оставляем в ответе: клиент рассчитывает на "repliedAt": null и т.п.
    default-property-inclusion: always
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # HS256, минимум 32 байта. В проде передавать через переменную окружения.
    secret: ${JWT_SECRET:change-me-in-production-please-32-bytes-minimum-secret}
    access-ttl: 15m
    refresh-ttl: 30d
  sms:
    provider: ${SMS_PROVIDER:log}       # log | nikita
    code-ttl: 2m
    max-attempts: 3
    resend-interval: 1m
    # в dev-режиме код возвращается в ответе /auth/request-code
    expose-code: ${SMS_EXPOSE_CODE:true}
    nikita:
      url: ${SMS_URL:https://smspro.nikita.kg/api/message}
      login: ${SMS_LOGIN:}
      password: ${SMS_PASSWORD:}
      sender: ${SMS_SENDER:Kudaibergen}
  request:
    normal-ttl: 24h
    urgent-ttl: 2h
    extend-by: 24h
    daily-limit-per-buyer: 10
  notification:
    dispatch-batch-size: 200
    max-attempts: 5
    batching-window: 15m
    batching-threshold: 3
  fcm:
    enabled: ${FCM_ENABLED:false}
    credentials-path: ${FCM_CREDENTIALS:}
  media:
    # dev: локальная папка, отдаётся статикой по /media/**; в проде — заменить на S3/GCS
    upload-dir: ${MEDIA_UPLOAD_DIR:uploads}
    max-photo-size: 10MB
    max-voice-size: 15MB
    max-video-size: 100MB

logging:
  level:
    kg.kudaibergen: INFO
