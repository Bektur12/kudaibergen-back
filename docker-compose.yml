services:
  postgres:
    image: postgres:16-alpine
    container_name: kudaibergen-postgres
    environment:
      POSTGRES_DB: kudaibergen
      POSTGRES_USER: kudaibergen
      POSTGRES_PASSWORD: kudaibergen
    ports:
      # порт наружу можно переопределить: DB_PORT=55432 docker compose up -d
      - "${DB_PORT:-5432}:5432"
    volumes:
      - kudaibergen-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kudaibergen -d kudaibergen"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:latest
    container_name: kudaibergen-centrifugo
    command: centrifugo -c /centrifugo/config.json
    volumes:
      - ./centrifugo/config.json:/centrifugo/config.json:ro
    environment:
      # секреты — только через env, config.json в репозитории их не содержит
      CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY: ${CENTRIFUGO_TOKEN_SECRET:-change-me-centrifugo-secret-32-bytes-min}
      CENTRIFUGO_HTTP_API_KEY: ${CENTRIFUGO_API_KEY:-change-me-centrifugo-api-key}
    ports:
      # 8000: клиентские WS/HTTP-подключения (/connection/websocket) и server API (/api)
      - "${CENTRIFUGO_PORT:-8000}:8000"

volumes:
  kudaibergen-pgdata:
